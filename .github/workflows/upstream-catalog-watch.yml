name: Upstream catalog watch

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-catalog-watch
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream catalog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Sync catalog from upstream
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GH_TOKEN: ${{ secrets.GIT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: bash scripts/automation/sync_upstream_catalog.sh
